<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Ameeri Movies</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding-bottom: 30px;
        }

        /* 1. Sticky player */
        #player-wrapper {
            position: sticky;
            top: 0;
            width: 100%;
            height: 240px;
            background-color: #000;
            z-index: 1000;
            border-bottom: 1px solid #1a1a1a;
        }
        @media (min-width: 768px) { #player-wrapper { height: 480px; } }

        #main-player { width: 100%; height: 100%; border: none; background-color: #000; }

        /* 2. Server bar + TV button */
        .controls-bar {
            background-color: #0a0a0a;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f1f1f;
            gap: 8px;
        }
        .server-buttons { display: flex; gap: 6px; }

        .btn-server {
            background: #1e1e24;
            color: #aaa;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-server.active { background: #e50914; color: #fff; border-color: #e50914; }

        .btn-tv {
            background: linear-gradient(135deg, #00c853, #009624);
            color: #fff !important;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        .now-playing-title {
            color: #e50914;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 38%;
        }

        /* 3. Search */
        .search-container { padding: 12px 14px 6px; display: flex; gap: 8px; }
        .search-input {
            flex: 1;
            background: #141414;
            border: 1px solid #282828;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .search-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 4. Categories */
        .categories-scroll {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: #141414;
            color: #b3b3b3;
            border: 1px solid #262626;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }
        .cat-chip.active { background: #e50914; color: #fff; border-color: #e50914; font-weight: bold; }

        .section-header {
            padding: 12px 16px 6px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header::before {
            content: "";
            width: 4px;
            height: 16px;
            background: #e50914;
            border-radius: 2px;
        }

        /* 5. Grid */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 14px;
        }
        @media (min-width: 600px) { .media-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; } }
        @media (min-width: 900px) { .media-grid { grid-template-columns: repeat(6, 1fr); } }

        .card {
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            border: 1px solid #1f1f1f;
        }
        .card:active { transform: scale(0.96); }
        .card img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; background: #181818; }
        .card-info { padding: 6px; }
        .card-title {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #eee;
        }
        .badge-type {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.75);
            color: #ffd700;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .empty-msg { grid-column: 1 / -1; text-align: center; color: #888; padding: 30px 0; font-size: 14px; }

        #tv-controls {
            display: none;
            background: #111;
            padding: 8px 14px;
            border-bottom: 1px solid #222;
            gap: 8px;
            align-items: center;
        }
        #tv-controls span { font-size: 12px; color: #aaa; }
        .tv-select {
            background: #222;
            color: #fff;
            border: 1px solid #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- 1. Player -->
    <div id="player-wrapper">
        <iframe id="main-player"
                src="about:blank"
                title="Video player"
                allowfullscreen
                referrerpolicy="no-referrer"
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture">
        </iframe>
    </div>

    <!-- 2. Server bar + TV button -->
    <div class="controls-bar">
        <div class="server-buttons">
            <button class="btn-server active" id="srv1" onclick="switchServer(1)">Server 1</button>
            <button class="btn-server" id="srv2" onclick="switchServer(2)">Server 2</button>
        </div>
        <div class="now-playing-title" id="now-playing">Choose a movie to watch</div>
        <a href="https://alameeereshooot-web.github.io/i/" class="btn-tv" title="Go to live TV">
            <i class="fas fa-tv"></i> TV
        </a>
    </div>

    <div id="tv-controls">
        <span>Season:</span>
        <select id="season-num" class="tv-select" onchange="updateEpisode()"></select>
        <span style="margin-inline-start: 6px;">Episode:</span>
        <select id="episode-num" class="tv-select" onchange="updateEpisode()"></select>
    </div>

    <!-- 3. Search -->
    <div class="search-container">
        <input type="text" id="search-box" class="search-input" placeholder="Search for a movie or series..." onkeydown="handleEnter(event)">
        <button class="search-btn" onclick="searchMedia()" aria-label="Search"><i class="fas fa-search"></i></button>
    </div>

    <!-- 4. Categories -->
    <div class="categories-scroll" id="categories">
        <div class="cat-chip active" data-cat="trending">🔥 Trending</div>
        <div class="cat-chip" data-cat="action">💥 Action &amp; Thriller</div>
        <div class="cat-chip" data-cat="series">📺 Series</div>
        <div class="cat-chip" data-cat="anime">🎨 Anime &amp; Cartoons</div>
        <div class="cat-chip" data-cat="comedy">😂 Comedy</div>
        <div class="cat-chip" data-cat="horror">👻 Horror</div>
    </div>

    <div class="section-header" id="current-cat-title">Trending</div>

    <!-- 5. Grid -->
    <div class="media-grid" id="grid"></div>

    <script>
        // Built-in catalog so the page works even if no API is available.
        // NOTE: poster paths are not verified; if an image doesn't load, check it on TMDB.
        const CATALOG = {
            trending: [
                { id: 533535, title: "Deadpool & Wolverine", type: "movie", poster: "https://image.tmdb.org/t/p/w342/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg" },
                { id: 1022789, title: "Inside Out 2", type: "movie", poster: "https://image.tmdb.org/t/p/w342/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg" },
                { id: 912649, title: "Venom: The Last Dance", type: "movie", poster: "https://image.tmdb.org/t/p/w342/aosm8Vh9ypZQIMejcuoTM6Fsiz0.jpg" },
                { id: 945961, title: "Alien: Romulus", type: "movie", poster: "https://image.tmdb.org/t/p/w342/b33nnKl1GSFbao4l3fZDDqsMx0F.jpg" },
                { id: 693134, title: "Dune: Part Two", type: "movie", poster: "https://image.tmdb.org/t/p/w342/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg" },
                { id: 519182, title: "Despicable Me 4", type: "movie", poster: "https://image.tmdb.org/t/p/w342/wWba3TaojhK7NdycRhoQpsG0FaH.jpg" },
                { id: 573435, title: "Bad Boys: Ride or Die", type: "movie", poster: "https://image.tmdb.org/t/p/w342/oGythE98MYleE6mZlGs5oBGkux1.jpg" },
                { id: 748783, title: "The Garfield Movie", type: "movie", poster: "https://image.tmdb.org/t/p/w342/p6AbOJvMQhBmffd0PIv0u8ghWeY.jpg" },
                { id: 653346, title: "Kingdom of the Planet of the Apes", type: "movie", poster: "https://image.tmdb.org/t/p/w342/gKkl37BQuKTanygYQG1pyYgLVgf.jpg" }
            ],
            action: [
                { id: 299534, title: "Avengers: Endgame", type: "movie", poster: "https://image.tmdb.org/t/p/w342/or06FN3Dka5tukK1e9sl16pB3iy.jpg" },
                { id: 299536, title: "Avengers: Infinity War", type: "movie", poster: "https://image.tmdb.org/t/p/w342/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg" },
                { id: 603, title: "The Matrix", type: "movie", poster: "https://image.tmdb.org/t/p/w342/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg" },
                { id: 155, title: "The Dark Knight", type: "movie", poster: "https://image.tmdb.org/t/p/w342/qJ2tW6WMUDux911r6m7haRef0WH.jpg" },
                { id: 245891, title: "John Wick", type: "movie", poster: "https://image.tmdb.org/t/p/w342/fZPS29VPJu3PD1twuqH73B8ioET.jpg" },
                { id: 98, title: "Gladiator", type: "movie", poster: "https://image.tmdb.org/t/p/w342/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg" }
            ],
            series: [
                { id: 94605, title: "Arcane", type: "tv", poster: "https://image.tmdb.org/t/p/w342/abPQHGqX6bqaN1z25f69h7w25Tf.jpg" },
                { id: 1396, title: "Breaking Bad", type: "tv", poster: "https://image.tmdb.org/t/p/w342/ztkUQFLlC19CCMYHW9o1zWhJRNq.jpg" },
                { id: 1399, title: "Game of Thrones", type: "tv", poster: "https://image.tmdb.org/t/p/w342/1XS1oqL89opfnbLl8WnZY1O1uJx.jpg" },
                { id: 66732, title: "Stranger Things", type: "tv", poster: "https://image.tmdb.org/t/p/w342/49WJfeN0moxb9IPfGn8AIqMGskD.jpg" },
                { id: 71446, title: "Money Heist", type: "tv", poster: "https://image.tmdb.org/t/p/w342/reEMJA1uzscCbk5rUhGny407Zvr.jpg" },
                { id: 93405, title: "Squid Game", type: "tv", poster: "https://image.tmdb.org/t/p/w342/dDlEmu3EZ0Pgg93K2SVNLCjCSvE.jpg" }
            ],
            anime: [
                { id: 85937, title: "Demon Slayer", type: "tv", poster: "https://image.tmdb.org/t/p/w342/xUfRZu2mi8jH6SzQEJGP6tjBuYj.jpg" },
                { id: 1429, title: "Attack on Titan", type: "tv", poster: "https://image.tmdb.org/t/p/w342/hTP1DtLGFamjfu8WqjnuQdP1n4i.jpg" },
                { id: 37854, title: "One Piece", type: "tv", poster: "https://image.tmdb.org/t/p/w342/cMD9Ygz11yjUhzXcURIImuFgOhd.jpg" },
                { id: 31911, title: "Fullmetal Alchemist: Brotherhood", type: "tv", poster: "https://image.tmdb.org/t/p/w342/5ZFUEOULaVml7p19UPF95MiYGEU.jpg" }
            ],
            comedy: [
                { id: 18785, title: "The Hangover", type: "movie", poster: "https://image.tmdb.org/t/p/w342/ulMsce9AoWoV0Gv2k25qH2xR6y4.jpg" },
                { id: 76163, title: "The Dictator", type: "movie", poster: "https://image.tmdb.org/t/p/w342/3w6bBfgjEHQG8h9j5jN4uU7U7Zf.jpg" }, // ID corrected (was 12133)
                { id: 8363, title: "Superbad", type: "movie", poster: "https://image.tmdb.org/t/p/w342/ek8e8txUyU2G4t997W248qg9vJv.jpg" }
            ],
            horror: [
                { id: 578, title: "Jaws", type: "movie", poster: "https://image.tmdb.org/t/p/w342/lxM6kqilAdpdhqUl2biY2gnqUha.jpg" },
                { id: 138843, title: "The Conjuring", type: "movie", poster: "https://image.tmdb.org/t/p/w342/wVYREutTvI2tmxr6ujrHT704wGF.jpg" }, // ID corrected (was 423204)
                { id: 346364, title: "It", type: "movie", poster: "https://image.tmdb.org/t/p/w342/9E2STOx92IRioHb7aD69jM06796.jpg" }
            ]
        };

        const ALL_ITEMS = Object.values(CATALOG).flat();

        let currentServer = 1;
        let currentItem = CATALOG.trending[0];
        let currentSeason = 1;
        let currentEpisode = 1;

        // Escape text before inserting it into HTML (fixes quote/XSS problems)
        function esc(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function playMedia() {
            document.getElementById('now-playing').textContent = currentItem.title;

            const id = currentItem.id;
            const isTv = currentItem.type === 'tv';
            let src;

            if (currentServer === 1) {
                src = isTv
                    ? `https://player.autoembed.cc/embed/tv/${id}/${currentSeason}/${currentEpisode}`
                    : `https://player.autoembed.cc/embed/movie/${id}`;
            } else {
                src = isTv
                    ? `https://vidlink.pro/tv/${id}/${currentSeason}/${currentEpisode}`
                    : `https://vidlink.pro/movie/${id}`;
            }

            document.getElementById('main-player').src = src;
        }

        function switchServer(num) {
            currentServer = num;
            document.getElementById('srv1').classList.toggle('active', num === 1);
            document.getElementById('srv2').classList.toggle('active', num === 2);
            playMedia();
        }

        function selectMedia(item) {
            currentItem = item;
            currentSeason = 1;
            currentEpisode = 1;

            const tvCtrl = document.getElementById('tv-controls');
            if (item.type === 'tv') {
                tvCtrl.style.display = 'flex';
                setupTvDropdowns();
            } else {
                tvCtrl.style.display = 'none';
            }

            playMedia();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupTvDropdowns() {
            const sSelect = document.getElementById('season-num');
            const eSelect = document.getElementById('episode-num');
            sSelect.innerHTML = '';
            eSelect.innerHTML = '';
            for (let s = 1; s <= 10; s++) sSelect.add(new Option(`Season ${s}`, s));
            for (let e = 1; e <= 30; e++) eSelect.add(new Option(`Episode ${e}`, e));
        }

        function updateEpisode() {
            currentSeason = parseInt(document.getElementById('season-num').value, 10);
            currentEpisode = parseInt(document.getElementById('episode-num').value, 10);
            playMedia();
        }

        function renderList(items) {
            const grid = document.getElementById('grid');
            if (!items.length) {
                grid.innerHTML = '<div class="empty-msg">No results found.</div>';
                return;
            }
            grid.innerHTML = items.map(it => `
                <div class="card" data-id="${it.id}" data-type="${it.type}">
                    <span class="badge-type">${it.type === 'tv' ? 'Series' : 'Movie'}</span>
                    <img src="${esc(it.poster)}" alt="${esc(it.title)}" loading="lazy">
                    <div class="card-info"><div class="card-title">${esc(it.title)}</div></div>
                </div>
            `).join('');
        }

        // One click handler for all cards (no inline onclick, no quote-escaping issues)
        document.getElementById('grid').addEventListener('click', e => {
            const card = e.target.closest('.card');
            if (!card) return;
            const item = ALL_ITEMS.find(i => i.id == card.dataset.id && i.type === card.dataset.type);
            if (item) selectMedia(item);
        });

        document.getElementById('categories').addEventListener('click', e => {
            const chip = e.target.closest('.cat-chip');
            if (chip) loadCategory(chip.dataset.cat, chip);
        });

        function loadCategory(cat, chipEl) {
            if (chipEl) {
                document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
                chipEl.classList.add('active');
                // Remove the leading emoji from the label
                document.getElementById('current-cat-title').textContent =
                    chipEl.textContent.replace(/^\S+\s+/, '');
            }
            renderList(CATALOG[cat] || CATALOG.trending);
        }

        function searchMedia() {
            const q = document.getElementById('search-box').value.toLowerCase().trim();
            if (!q) return;

            const filtered = ALL_ITEMS.filter(it => it.title.toLowerCase().includes(q));
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            document.getElementById('current-cat-title').textContent = `Search results: "${q}"`;
            renderList(filtered); // shows "No results" instead of silently showing trending
        }

        function handleEnter(e) {
            if (e.key === 'Enter') searchMedia();
        }

        window.addEventListener('load', () => {
            playMedia();
            loadCategory('trending', null);
        });
    </script>
</body>
</html>
